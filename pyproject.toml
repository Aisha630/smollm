[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "smollm-alignment-lab"
version = "0.1.0"
description = "A from-scratch SmolLM implementation with LoRA fine-tuning and DPO alignment."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Ayesha Shafique", email = "ayeshashafique123@gmail.com" },
]
keywords = ["language-models", "pytorch", "lora", "dpo", "llm-alignment"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.26", "torch>=2.5"]

[project.optional-dependencies]
train = [
  "accelerate>=1.0",
  "datasets>=3.0",
  "transformers>=4.45,<5",
  "tqdm>=4.66",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8",
]

[project.scripts]
smollm-lab = "smollm_lab.cli:main"

[project.urls]
Repository = "https://github.com/Aisha630/smollm-alignment-lab"

[tool.hatch.build.targets.wheel]
packages = ["src/smollm_lab"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
